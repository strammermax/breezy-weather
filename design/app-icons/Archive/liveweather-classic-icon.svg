<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Live Weather classic icon</title>
  <desc id="desc">A circular blue weather icon with a mountain, cloud, sun and green hills.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1475ad"/>
      <stop offset="1" stop-color="#2b8bb9"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8796"/>
      <stop offset="1" stop-color="#526b79"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ca343"/>
      <stop offset="1" stop-color="#4f792d"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="206"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#153747" flood-opacity=".34"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="229" fill="#83c4e6" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="206" fill="url(#sky)"/>

  <g clip-path="url(#disc)">
    <circle cx="351" cy="161" r="45" fill="#ffd35a"/>

    <path d="M40 390 170 239l65 77 78-130 172 204v85H40Z" fill="url(#mountain)"/>
    <path d="m170 239 65 77 78-130 55 66-42-22-26 39-24-22-41 69-26-31Z" fill="#f2f7f7"/>

    <path d="M42 399c76-64 145-70 221-12 71-72 147-76 217-7v103H42Z" fill="url(#hill)"/>

    <g fill="#f7fbfc">
      <circle cx="162" cy="264" r="48"/>
      <circle cx="217" cy="247" r="67"/>
      <circle cx="280" cy="264" r="50"/>
      <circle cx="326" cy="279" r="36"/>
      <path d="M114 264h248c13 0 24 11 24 24s-11 24-24 24H114c-13 0-24-11-24-24s11-24 24-24Z"/>
    </g>
    <path d="M112 288h272c-2 13-12 24-25 24H117c-13 0-23-11-25-24Z" fill="#d9e7ed" opacity=".72"/>
  </g>
</svg>
