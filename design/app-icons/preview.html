<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveWeather app-iconconcepten</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 48px; background: #11151b; color: #f5f7fa; }
    h1 { margin: 0 0 32px; font-size: 30px; }
    main { display: flex; gap: 32px; }
    figure { margin: 0; padding: 24px; background: #1c222b; border-radius: 24px; text-align: center; }
    img { display: block; width: 240px; height: 240px; }
    figcaption { margin-top: 16px; font-size: 20px; font-weight: 650; }
  </style>
</head>
<body>
  <h1>Vectorconcepten voor het app-icoon</h1>
  <main>
    <figure><img src="landscape-cloud-classic.svg" alt="Klassiek"><figcaption>1. Klassiek</figcaption></figure>
    <figure><img src="landscape-cloud-sun.svg" alt="Met zon"><figcaption>2. Met zon</figcaption></figure>
    <figure><img src="landscape-cloud-minimal.svg" alt="Minimalistisch"><figcaption>3. Minimalistisch</figcaption></figure>
  </main>
</body>
</html>
