name: Update in-app release notes

on:
  push:
    branches: [main]
    paths-ignore:
      - app/src/main/assets/release-notes.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: python scripts/generate_release_notes.py

      - name: Commit changed release notes
        run: |
          if git diff --quiet -- app/src/main/assets/release-notes.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/release-notes.json
          git commit -m "Update app information [skip ci]"
          git push
