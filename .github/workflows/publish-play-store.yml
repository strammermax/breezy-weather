name: Publish to Play Store

# Triggered by scripts/release.ps1, which tags+pushes "vX.Y.Z" (basic flavor) or
# "vX.Y.Z-freenet" (GitHub-release-only, never published to Play). Also runnable by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta

jobs:
  publish:
    if: ${{ !endsWith(github.ref_name, '-freenet') }}
    runs-on: 'ubuntu-24.04'
    env:
      # Tag-triggered releases always remain internal. A maintainer can select
      # closed (alpha) or open (beta) testing only when starting the workflow manually.
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: app/build.gradle.kts shells out to git (getLwwPatch/getCommitCount)
          # to compute versionCode/versionName from commit counts since the fork base - a
          # shallow clone doesn't have that history and makes those git calls fail.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Write release keystore
        run: |
          set -e
          # storeFile in keystore.properties is resolved by app/build.gradle.kts via file(),
          # which is relative to the app/ module directory - not the repo root.
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PLAY_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PLAY_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.PLAY_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PLAY_SIGNING_KEY_PASSWORD }}

      - name: Write Play Console service account key
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Write Firebase google-services.json
        # Required by the com.google.gms.google-services plugin for any release build task
        # (FCM push notifications, see docs/UpdateFLow.md flow 5) - gitignored, so CI needs
        # its own copy from a secret.
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Write RemoveSky config
        run: |
          set -e
          # app/build.gradle.kts bakes these into BuildConfig for every buildType (incl.
          # release) from local.properties - without this, the release build ships with
          # empty REMOVESKY_API_KEY/CF_ACCESS_* and RemoveSky requests get rejected.
          cat >> local.properties <<EOF
          lww.removesky.url=$REMOVESKY_URL
          lww.removesky.apikey=$REMOVESKY_API_KEY
          lww.cfaccess.id=$CF_ACCESS_CLIENT_ID
          lww.cfaccess.secret=$CF_ACCESS_CLIENT_SECRET
          EOF
        env:
          REMOVESKY_URL: ${{ secrets.LWW_REMOVESKY_URL }}
          REMOVESKY_API_KEY: ${{ secrets.LWW_REMOVESKY_APIKEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.LWW_CFACCESS_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.LWW_CFACCESS_SECRET }}

      - name: Verify RemoveSky secrets against the live service
        run: |
          set -e
          base="${REMOVESKY_URL:-https://removesky.vanburik.info}"
          code=$(curl -sS -o /tmp/removesky_health.txt -w "%{http_code}" "$base/api/v1/health" \
            -H "User-Agent: LiveWallpaperWeather/1.0" \
            -H "x-api-key: $REMOVESKY_API_KEY" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          echo "RemoveSky /health responded HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::RemoveSky health check failed with HTTP $code - the release build's RemoveSky secrets are wrong or the service is down. See body below (should not contain secret values):"
            cat /tmp/removesky_health.txt
            exit 1
          fi
        env:
          REMOVESKY_URL: ${{ secrets.LWW_REMOVESKY_URL }}
          REMOVESKY_API_KEY: ${{ secrets.LWW_REMOVESKY_APIKEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.LWW_CFACCESS_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.LWW_CFACCESS_SECRET }}

      - name: Publish basic flavor to Play Store ${{ env.PLAY_TRACK }} track
        run: ./gradlew publishBasicReleaseBundle --track "$PLAY_TRACK"

      - name: Remove secrets from workspace
        if: always()
        run: rm -f app/release.jks keystore.properties play-service-account.json local.properties app/google-services.json
